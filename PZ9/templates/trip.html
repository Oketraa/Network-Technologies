<div class="page-title"><h1>Вы в пути</h1></div>
<div class="map-wrap">{{!route_map}}<div class="arrival-chip"><strong>{{trip_eta}}</strong><small>До прибытия</small></div></div>

<section class="surface"><div class="sheet-head"><h2>Текущая поездка</h2><span class="status-line"><i></i> В движении</span></div>{{!route}}<div class="trip-summary"><div><small>Осталось</small><strong>{{remaining}}</strong></div><div><small>Стоимость</small><strong>{{price}}</strong></div></div>
<form class="action-form" action="/action/finish" method="post" data-log-target="completed.html" data-log-event="trip.finish_requested" data-log-level="info">{{!csrf}}<input type="hidden" name="order" value="{{order_id}}"><button type="submit" class="button button-primary ">Завершить поездку <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></form><div class="quiet-actions"><a href="early_stop.html" data-log-event="trip.early_stop_requested" data-log-level="warn">Завершить досрочно</a><a href="support.html">Поддержка</a></div>
</section>
