<div class="page-title"><h1>Ваш маршрут готов</h1><p>Проверьте маршрут и стоимость поездки</p></div>
{{!route_map}}

<section class="surface">{{!route}}<div class="horizontal-rule"></div><div class="price-line"><span>Стоимость поездки</span><strong>{{price}}</strong></div><div class="trip-facts"><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Около {{duration}}</span><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v1"/></svg> {{seats}} · {{pickup_when}}</span></div><div class="horizontal-rule"></div><div class="payment-line"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg> <span>{{payment}}</span></div>
<form class="action-form" action="/action/confirm" method="post" data-log-target="active.html" data-log-event="order.confirmed" data-log-level="info">{{!csrf}}<input type="hidden" name="quote" value="{{quote_token}}"><button type="submit" class="button button-primary ">Подтвердить заказ <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></form><a class="sub-link" href="order.html">Изменить маршрут</a>
</section>
