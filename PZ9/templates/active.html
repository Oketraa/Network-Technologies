<div class="page-title"><h1>Автомобиль в пути</h1><p>Заказ {{order_code}}</p></div>
<div class="map-wrap">{{!route_map}}<div class="arrival-chip"><strong>{{arrival_eta}}</strong><small>До прибытия</small></div></div>

<section class="surface">
<div class="sheet-head"><h2>Ваш автомобиль</h2><span class="status-line"><i></i> В пути</span></div>
{{!vehicle}}
{{!route}}
<div class="price-line"><span>Стоимость</span><strong>{{price}}</strong></div>
<form class="action-form" action="/action/arrive" method="post" data-log-target="arrived.html" data-log-event="trip.arrival_opened" data-log-level="info">{{!csrf}}<input type="hidden" name="order" value="{{order_id}}"><button type="submit" class="button button-primary ">Автомобиль прибыл <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></form><div class="quiet-actions">
<form class="action-form" action="/action/cancel" method="post" data-log-target="cancel.html" data-log-event="order.cancelled" data-log-level="warn">{{!csrf}}<input type="hidden" name="order" value="{{order_id}}"><button type="submit">Отменить заказ</button></form><a href="support.html">Нужна помощь?</a></div>
</section>
