<div class="page-title"><h1>Написать в поддержку</h1><p>Опишите, что произошло</p></div>

<section class="surface">
<form data-log-event="support.ticket_submitted" action="/action/ticket" method="post" data-log-target="ticket.html">{{!csrf}}<input type="hidden" name="order" value="{{linked_order}}"><label class="input-label" for="topic">Тема обращения</label><select class="input" id="topic" name="topic">{{!topics}}</select><label class="input-label" for="problem">Сообщение</label><textarea class="input textarea large" id="problem" name="message" maxlength="2000" required placeholder="Опишите ситуацию">{{message}}</textarea><div class="small-context">{{order_context}}</div><button type="submit" class="button button-primary">Сохранить обращение <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></form>
</section>
